<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>Chat Hydra Overlay</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: transparent; }
    body { color: #fff; font: 700 30px system-ui, sans-serif; text-shadow: 0 3px 12px #100817; }
    #battle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 85px; }
    #boss-name { font-size: 48px; letter-spacing: 3px; text-transform: uppercase; }
    #arena { position: relative; width: 100%; height: 550px; display: grid; place-items: center; }
    #boss { font-size: 310px; line-height: 1; filter: drop-shadow(0 0 28px #9b37ff) drop-shadow(0 15px 12px #000); transform: scale(var(--boss-scale, 1)); transition: transform .6s ease, filter .2s; user-select: none; }
    #arena.hit { animation: shake .28s linear; }
    #arena.hit #boss { filter: drop-shadow(0 0 42px #ff4e9a) drop-shadow(0 15px 12px #000); }
    #hp-wrap { width: 920px; }
    #hp-label { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 26px; }
    #track { height: 34px; padding: 4px; border: 3px solid #fff; border-radius: 30px; background: #171022d9; box-shadow: 0 0 20px #9b37ff; }
    #hp { width: 100%; height: 100%; border-radius: 20px; background: linear-gradient(90deg, #61f5a3, #f7ed4a 65%, #ff547d); transition: width .55s cubic-bezier(.2,.8,.2,1); }
    #leaderboard { position: absolute; top: 34px; right: 44px; width: 300px; padding: 18px 20px; border: 1px solid #ffffff66; border-radius: 16px; background: #171022c9; }
    #leaderboard h2 { margin: 0 0 10px; font-size: 24px; } #leaders { margin: 0; padding-left: 28px; font-size: 20px; }
    #leaders li { padding: 4px 0; } #leaders small { display: block; color: #ffe95e; font-size: 14px; }
    #taunt { position: absolute; z-index: 3; top: 0; left: 50%; max-width: 80%; transform: translateX(-50%); border: 2px solid #fff; border-radius: 24px; padding: 14px 26px; background: #551b78e8; font-size: 28px; opacity: 0; transition: opacity .2s; white-space: nowrap; }
    #taunt.show { opacity: 1; } #buffs { position: absolute; top: 35px; left: 42px; display: grid; gap: 8px; }
    .badge { border-radius: 12px; padding: 10px 14px; background: #e54170e8; font-size: 20px; }
    #clutch-badge { position: absolute; z-index: 4; top: 28px; left: 50%; transform: translateX(-50%); padding: 14px 28px; border: 3px solid #fff; border-radius: 18px; background: #d52f66f2; box-shadow: 0 0 28px #ff4e9a; color: #fff; font-size: 42px; letter-spacing: 2px; white-space: nowrap; }
    #clutch-badge[hidden] { display: none; }
    .float { position: absolute; z-index: 2; animation: float-up 1.4s ease-out forwards; color: #ffe95e; font-size: 46px; white-space: nowrap; }
    .float small { display: block; text-align: center; color: white; font-size: 22px; }
    #defeated { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(ellipse, #3110449c 0%, #11101d55 38%, transparent 72%); }
    #defeated.show { display: flex; animation: appear .35s ease-out; }
    #defeated strong { z-index: 2; color: #ffe95e; font-size: 100px; letter-spacing: 8px; -webkit-text-stroke: 2px #7e1caf; }
    #summary-card { z-index: 3; width: 620px; margin-top: 25px; padding: 20px 30px; border: 2px solid #ffe95e; border-radius: 18px; background: #171022ed; font-size: 24px; }
    #summary-card h2 { margin: 0 0 8px; color: #ffe95e; text-align: center; font-size: 30px; } #summary-lines { margin: 0; padding-left: 35px; }
    #explosion { position: absolute; font-size: 200px; animation: boom .9s ease-out both; filter: drop-shadow(0 0 30px #ff7a2e); }
    .spark { position: absolute; font-size: 48px; animation: burst .9s ease-out both; }
    @keyframes shake { 20% { transform: translate(12px,-5px); } 40% { transform: translate(-14px,4px); } 60% { transform: translate(9px,3px); } 80% { transform: translate(-6px,-3px); } }
    @keyframes float-up { from { opacity: 0; transform: translate(-50%,20px) scale(.7); } 15% { opacity: 1; } to { opacity: 0; transform: translate(-50%,-150px) scale(1.15); } }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
    @keyframes boom { from { opacity: 0; transform: scale(.15) rotate(-25deg); } 55% { opacity: 1; transform: scale(1.35) rotate(8deg); } to { opacity: 1; transform: scale(1); } }
    @keyframes burst { from { opacity: 1; transform: translate(0,0) scale(.4); } to { opacity: 0; transform: translate(var(--x),var(--y)) scale(1.25) rotate(35deg); } }
  </style>
</head>
<body>
  <main id="battle">
    <div id="boss-name">Connecting…</div>
    <div id="arena"><div id="taunt"></div><div id="boss" aria-label="Boss">🐉</div></div>
    <section id="hp-wrap">
      <div id="hp-label"><span>❤️ BOSS HP</span><span id="hp-text">—</span></div>
      <div id="track"><div id="hp"></div></div>
    </section>
  </main>
  <div id="defeated"><div id="explosion">💥</div><strong>BOSS DEFEATED</strong></div>
  <aside id="leaderboard"><h2>🏆 TOP CHAT DAMAGE</h2><ol id="leaders"></ol></aside>
  <div id="buffs"></div>
  <div id="clutch-badge" hidden></div>
  <script>
    const arena = document.querySelector('#arena');
    const boss = document.querySelector('#boss');
    const name = document.querySelector('#boss-name');
    const hp = document.querySelector('#hp');
    const hpText = document.querySelector('#hp-text');
    const defeated = document.querySelector('#defeated');
    const tauntBubble = document.querySelector('#taunt');
    const leaderList = document.querySelector('#leaders');
    const buffs = document.querySelector('#buffs');
    const clutchBadge = document.querySelector('#clutch-badge');
    let stunnedUntil = 0;
    const summary = document.createElement('section');
    summary.id = 'summary-card';
    summary.innerHTML = '<h2>FIGHT SUMMARY</h2><ol id="summary-lines"></ol>';
    defeated.append(summary);
    function connectSocket() {
    const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
    socket.onclose = () => setTimeout(connectSocket, 1000);
    socket.onerror = () => socket.close();

    function showState(state) {
      name.textContent = state.name;
      boss.textContent = state.emoji || '🐉';
      hpText.textContent = `${state.currentHP} / ${state.maxHP}`;
      hp.style.width = `${state.maxHP ? state.currentHP / state.maxHP * 100 : 0}%`;
      boss.style.setProperty('--boss-scale', Math.min(1.35, 1 + (state.maxHP - 40) / 250));
      defeated.classList.toggle('show', state.phase === 'defeated');
      if (state.phase === 'defeated') burst();
      tauntBubble.textContent = state.taunt || '';
      tauntBubble.dataset.until = state.tauntUntil || 0;
      tauntBubble.classList.toggle('show', Boolean(state.taunt && state.tauntUntil > Date.now()));
      stunnedUntil = state.stunnedUntil || 0;
      updateClutchBadge();
      leaderList.replaceChildren(...(state.leaderboard || []).map((entry, index) => {
        const row = document.createElement('li');
        row.append(document.createTextNode(`${entry.username} — ${entry.damage} dmg`));
        const titles = [];
        if ((state.summary?.lastHit || state.lastHit) === entry.username) titles.push('Boss Slayer');
        if ((state.summary?.mvp || state.leaderboard?.[0]?.username) === entry.username) titles.push('MVP');
        if (titles.length) { const tag = document.createElement('small'); tag.textContent = titles.join(' · '); row.append(tag); }
        return row;
      }));
      const lines = summary.querySelector('#summary-lines');
      lines.replaceChildren();
      if (state.summary) {
        for (const entry of state.summary.leaderboard) {
          const row = document.createElement('li');
          const titles = [entry.username === state.summary.lastHit ? 'Boss Slayer' : '', entry.username === state.summary.mvp ? 'MVP' : ''].filter(Boolean);
          row.textContent = `${entry.username} — ${entry.damage} damage${titles.length ? ` · ${titles.join(' · ')}` : ''}`;
          lines.append(row);
        }
        const slayer = document.createElement('li');
        slayer.textContent = `Boss Slayer — last hit: ${state.summary.lastHit}`;
        if (!state.summary.leaderboard.some(entry => entry.username === state.summary.lastHit)) lines.prepend(slayer);
      }
      const active = [];
      if (state.powerUpUntil > Date.now()) active.push('✨ CHAT POWER-UP ×2');
      buffs.replaceChildren(...active.map(text => { const badge = document.createElement('div'); badge.className = 'badge'; badge.textContent = text; return badge; }));
    }

    function burst() {
      document.querySelectorAll('.spark').forEach((spark) => spark.remove());
      for (let i = 0; i < 18; i++) {
        const spark = document.createElement('span');
        const angle = (Math.PI * 2 * i) / 18;
        spark.className = 'spark';
        spark.textContent = ['✨', '⭐', '🔥', '💫'][i % 4];
        spark.style.setProperty('--x', `${Math.cos(angle) * 420}px`);
        spark.style.setProperty('--y', `${Math.sin(angle) * 330}px`);
        defeated.append(spark);
      }
    }

    function updateClutchBadge() {
      const remaining = Math.ceil((stunnedUntil - Date.now()) / 1000);
      clutchBadge.hidden = remaining <= 0;
      if (remaining > 0) clutchBadge.textContent = `⚡ CLUTCH STUN — ${remaining}s`;
    }

    socket.onmessage = ({ data }) => {
      const event = JSON.parse(data);
      if (event.type === 'state') showState(event.state);
      if (event.type === 'damage') {
        arena.classList.remove('hit');
        void arena.offsetWidth;
        arena.classList.add('hit');
        const float = document.createElement('div');
        float.className = 'float';
        float.style.left = `${35 + Math.random() * 30}%`;
        float.style.top = `${20 + Math.random() * 45}%`;
        const points = document.createElement('span');
        points.textContent = `-${event.event.damage}`;
        const player = document.createElement('small');
        player.textContent = event.event.username;
        float.append(points, player);
        arena.append(float);
        setTimeout(() => float.remove(), 1450);
      }
    };
    }
    connectSocket();
    setInterval(() => {
      if (tauntBubble.textContent && Number(tauntBubble.dataset.until || 0) < Date.now()) tauntBubble.classList.remove('show');
      updateClutchBadge();
    }, 500);
  </script>
</body>
</html>
