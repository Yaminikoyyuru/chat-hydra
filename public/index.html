<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boss Battle — Live Chat</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #10111b; color: #f5f3ff; }
    body { max-width: 760px; margin: 48px auto; padding: 0 20px; }
    h1 { margin-bottom: 6px; } p { color: #aaa8bb; margin-top: 0; }
    #messages { display: grid; gap: 10px; padding: 0; list-style: none; }
    li { padding: 12px 16px; border: 1px solid #343246; border-radius: 12px; background: #191a28; overflow-wrap: anywhere; }
    strong { color: #c7a6ff; margin-right: 8px; }
    #status { color: #8ce0a6; }
  </style>
</head>
<body>
  <h1>⚔️ Boss Battle</h1>
  <p><span id="status">Connecting…</span> · Live chat feed</p>
  <ul id="messages" aria-live="polite"></ul>
  <script>
    const status = document.querySelector('#status');
    const list = document.querySelector('#messages');
    const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
    socket.onopen = () => status.textContent = 'Connected';
    socket.onclose = () => status.textContent = 'Disconnected';
    socket.onmessage = ({ data }) => {
      const event = JSON.parse(data);
      if (event.type !== 'chat') return;
      const message = event.message;
      const row = document.createElement('li');
      const name = document.createElement('strong');
      name.textContent = message.username;
      row.append(name, document.createTextNode(message.message));
      list.prepend(row);
      while (list.children.length > 50) list.lastElementChild.remove();
    };
  </script>
</body>
</html>
